# =============================================================================
#  Locarent — pile de production (image autonome + PostgreSQL + migrations)
#
#  Cette pile reproduit ce que Dokploy exécutera. Elle sert à valider le
#  déploiement en local avant de toucher au serveur.
#
#    cp .env.stack.example .env.stack   # puis renseigner AUTH_SECRET
#    docker compose -f docker-compose.prod.yml up -d --build
#    curl http://localhost:3212/api/health
#
#  Ordre : postgres (healthy) → migrate (une fois) → app.
#  Les migrations ne sont PAS dans l'entrypoint de l'app : avec plusieurs
#  réplicas, elles s'exécuteraient en parallèle et se marcheraient dessus.
# =============================================================================

name: locarent-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-locarent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      POSTGRES_DB: ${POSTGRES_DB:-locarent}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: Pacific/Tahiti
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-locarent} -d ${POSTGRES_DB:-locarent}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Aucun port publié : la base n'est joignable que par le réseau interne.
    expose:
      - "5432"

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-locarent}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}@postgres:5432/${POSTGRES_DB:-locarent}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    # Aucun `env_file` : les variables viennent du contexte d'interpolation
    # (--env-file en local, interface Dokploy sur le serveur). Un env_file
    # obligatoire ferait échouer le déploiement, puisque le fichier n'existe
    # pas dans le dépôt.
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-locarent}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}@postgres:5432/${POSTGRES_DB:-locarent}?schema=public
      APP_URL: ${APP_URL:?APP_URL est requis (URL publique, sert aux liens d'invitation)}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET est requis (openssl rand -base64 48)}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-console}
      MAIL_FROM: ${MAIL_FROM:-Locarent <no-reply@locarent.test>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    # Sur Dokploy, Traefik joint le conteneur par le réseau interne : ce
    # port publié ne sert qu'à la vérification locale.
    ports:
      - "${APP_HOST_PORT:-3212}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Espace de stockage des photos (permis, états des lieux) : activé au Lot 3.
  # Décommenter avec les variables S3_* correspondantes.
  #
  # minio:
  #   image: minio/minio:latest
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${S3_ACCESS_KEY:?requis}
  #     MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?requis}
  #   volumes:
  #     - minio-data:/data

volumes:
  postgres-data:
  # minio-data:
