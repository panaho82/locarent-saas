name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Base de service : identifiants jetables, valables le temps du runner.
  DATABASE_URL: postgresql://locarent:locarent@localhost:5432/locarent?schema=public
  AUTH_SECRET: ci-secret-jetable-uniquement-pour-les-tests
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Types, lint, tests (unitaire + intégration sur vraie base), build
  # ---------------------------------------------------------------------------
  qualite:
    name: Types · Lint · Tests · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: locarent
          POSTGRES_PASSWORD: locarent
          POSTGRES_DB: locarent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U locarent -d locarent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm prisma generate

      - name: Appliquer les migrations
        run: pnpm prisma migrate deploy

      - name: Vérifier les types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build de production
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Parcours réels dans un navigateur, sur le serveur standalone
  # ---------------------------------------------------------------------------
  e2e:
    name: Parcours end-to-end
    runs-on: ubuntu-latest
    needs: qualite
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: locarent
          POSTGRES_PASSWORD: locarent
          POSTGRES_DB: locarent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U locarent -d locarent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm prisma generate

      - name: Appliquer les migrations
        run: pnpm prisma migrate deploy

      - name: Build de production
        run: pnpm build

      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests end-to-end
        run: pnpm exec playwright test

      - name: Conserver les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # L'image Docker doit se construire : c'est elle qui part en production.
  # ---------------------------------------------------------------------------
  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t locarent:ci .

      - name: Construire l'image de migration
        run: docker build --target migrator -t locarent:ci-migrator .
